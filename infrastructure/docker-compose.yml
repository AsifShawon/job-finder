services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ooi}
      POSTGRES_USER: ${POSTGRES_USER:-ooi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ooi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  searxng:
    image: searxng/searxng:latest
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ooi:ooi@postgres:5432/ooi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-raw-docs}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      SEARCH_PROVIDER_BASE_URL: ${SEARCH_PROVIDER_BASE_URL:-http://searxng:8080}
      PYTHONPATH: /workspace/apps/api:/workspace/apps/worker
    working_dir: /workspace/apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ooi:ooi@postgres:5432/ooi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEARCH_PROVIDER_BASE_URL: ${SEARCH_PROVIDER_BASE_URL:-http://searxng:8080}
      PYTHONPATH: /workspace/apps/api:/workspace/apps/worker
    working_dir: /workspace/apps/worker
    command: celery -A worker.celery_app:celery_app worker --loglevel=INFO --pool=solo --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ooi:ooi@postgres:5432/ooi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /workspace/apps/api:/workspace/apps/worker
    working_dir: /workspace/apps/worker
    command: celery -A worker.celery_app:celery_app beat --loglevel=INFO
    depends_on:
      worker:
        condition: service_started

  flower:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ooi:ooi@postgres:5432/ooi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /workspace/apps/api:/workspace/apps/worker
    working_dir: /workspace/apps/worker
    command: celery -A worker.celery_app:celery_app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    working_dir: /workspace
    command: npm --workspace apps/web run start -- --hostname 0.0.0.0 --port 3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  fastembed_cache:
  web_node_modules:
  web_next_cache:
