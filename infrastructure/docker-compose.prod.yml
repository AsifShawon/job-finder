services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  searxng:
    restart: unless-stopped

  api:
    env_file:
      - ../.env.prod
    restart: unless-stopped
    volumes:
      - fastembed_cache:/root/.cache/fastembed
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8001}:8000"

  worker:
    env_file:
      - ../.env.prod
    restart: unless-stopped
    volumes:
      - fastembed_cache:/root/.cache/fastembed

  beat:
    env_file:
      - ../.env.prod
    restart: unless-stopped

  flower:
    env_file:
      - ../.env.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLOWER_HOST_PORT:-5555}:5555"

  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env.prod}
    env_file:
      - ../.env.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3001}:3000"
